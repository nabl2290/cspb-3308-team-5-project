{% extends "base.html" %}

{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block content %}
<h1 class="dashboard-h1">Dashboard</h1>
    <p>You have {{ baby_count }} babies</p>

    {% for baby in babies %}
        <div>
            <h3>{{ baby[1] }} {{ baby[2] }}</h3>
            <p>DOB: {{ baby[3] }}</p>
            <p>Gender: {{ baby[4] }}</p>
        </div>
    {% endfor %}
{% endblock %}
