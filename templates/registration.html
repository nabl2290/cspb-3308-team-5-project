{% extends "auth_base.html" %}
{% block title %}Baby Steps Registration{% endblock %}

{% block content %}
<div>
  <h1 class="app-title">Baby Steps</h1>
  <section id="registration" class="form form__wrapper">
  <form action="/register" method="post" class="registration-form">
    <h2 class="form__title">Sign Up</h2>
    <div class="form__input-group">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
    </div>
    <div class="form__input-group">
      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
    </div>
    <div class="form__input-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>
    <div class="form__input-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>
    <div class="form__input-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
    </div>
    <div class="form__actions">
      <button type="submit" class="form__submit btn btn--blue">Register</button>
    </div>
    Already have an account? <a href="{{ url_for('login') }}" class="login-link">Login</a>
  </form>
</section>
</div>
{% endblock %}
