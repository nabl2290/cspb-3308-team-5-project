{% extends "base.html" %}

{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user_profile.css') }}">
{% endblock %}

{% block content %}
<h1 class="dashboard-h1">User Profile</h1>
<div class ="user-container">
    <p>Name: {{ user.first_name }} {{ user.last_name }}</p>
    <p>Email: {{ user.email }}</p>
    <button onclick="window.location.href='{{ url_for('edit_user', user_id=user.id) }}'">Edit</button>
</div>
{% endblock %}
