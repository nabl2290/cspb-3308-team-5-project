{% extends "base.html" %}
{% block title %}Edit Event{% endblock %} 

{% block stylesheet %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/feeding_event.css') }}">
{% endblock %}

{% block content %}
<div class="feeding-container">
    <div class="feeding-title">Edit Feeding Event</div>
    <form method="POST" action="{{ url_for('update_feeding_event', event_id = event.id )}}" class="feeding-form">
        <label>Child:</label>
        <select name="child_id" required>
            {% for child in children %}
            <option value="{{ child.id }}"
                {% if child.id == event.child_id %}selected{% endif %}>
                {{ child.first_name }} {{ child.last_name }}
            </option>
            {% endfor %}
        </select>
        <label>Date & Time:</label>
        <input type="datetime-local" name="date"
                value="{{ event.timestamp.strftime('%Y-%m-%dT%H:%M') }}"
                required>
    
        <label>Description:</label>
        <textarea name="description" value="{{ event.description or '' }}"></textarea>
        <div class="button-container">
            <button type="submit">UPDATE FEED</button>
        </div>
    </form>
</div>
{% endblock %}
