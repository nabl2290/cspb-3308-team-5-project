<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Add Feed Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block stylesheet%}{% endblock %}
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
    <body style="text-align: center;">
        <form method="POST" action="/feeding-event/{{ event.id }}/edit">
            <select name="child_id" required>
                {% for child in children %}
                <option value="{{ child.id }}"
                    {% if child.id == event.child_id %}selected{% endif %}>
                    {{ child.name }}
                </option>
                {% endfor %}
            </select>
            <label>Date & Time:</label>
            <input type="datetime-local" name="date"
                   value="{{ event.timestamp.strftime('%Y-%m-%dT%H:%M') }}"
                   required>
        
            <label>Description:</label>
            <input name="description" value="{{ event.description or '' }}">
        
            <button type="submit">UPDATE FEED</button>
</form>
    </body>
</html>
